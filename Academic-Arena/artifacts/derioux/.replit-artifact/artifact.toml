kind = "web"
previewPath = "/"
title = "DERIOUX"
description = "A gamified academic productivity companion that turns studying into an RPG adventure with avatar customization, quests, combat-style quizzes, and progress tracking for students."
version = "1.0.0"
id = "artifacts/derioux"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20026

[services.development]
run = "pnpm --filter @workspace/derioux run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/derioux", "run", "build" ]
serve = "static"
publicDir = "artifacts/derioux/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20026"
BASE_PATH = "/"
